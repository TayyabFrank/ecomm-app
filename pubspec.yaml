publish_to: "none"

version: 1.0.0+1

environment:
  sdk: ">=3.3.0 <4.0.0"

dependencies:
  cached_network_image: ^3.4.1
  cloud_firestore: ^6.4.1
  encrypt: ^5.0.0
  firebase_auth: ^6.5.1
  firebase_core: ^4.9.0
  flutter:
    sdk: flutter
  http: ^1.2.0
  image_picker: ^1.1.2
  intl: ^0.20.2
  logger: ^2.4.0
  permission_handler: ^11.3.1
  provider: ^6.1.2
